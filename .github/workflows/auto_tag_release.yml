name: Label-Triggered Auto Version Bump & Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  bump_and_release:
    name: Check Labels, Bump SemVer & Trigger Release
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Version Bump Type from PR Labels
        id: semver_label
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "PR Labels: $LABELS"

          BUMP=""
          if echo "$LABELS" | grep -iq '"major"'; then
            BUMP="major"
          elif echo "$LABELS" | grep -iq '"minor"'; then
            BUMP="minor"
          elif echo "$LABELS" | grep -iq '"patch"'; then
            BUMP="patch"
          fi

          if [ -z "$BUMP" ]; then
            echo "No semantic version bump label found (major, minor, patch). Skipping automated release."
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Detected bump: $BUMP"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "bump_type=$BUMP" >> $GITHUB_OUTPUT
          fi

      - name: Compute Next SemVer Version
        if: steps.semver_label.outputs.should_release == 'true'
        id: next_version
        run: |
          # Fetch latest tag or fallback to starting point 0.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest Git Tag: $LATEST_TAG"

          CLEAN_VERSION="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          BUMP_TYPE="${{ steps.semver_label.outputs.bump_type }}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          echo "Calculated New Version Tag: $NEW_TAG"
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create Git Tag & Push
        if: steps.semver_label.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_TAG="${{ steps.next_version.outputs.new_tag }}"

          echo "Tagging HEAD with $NEW_TAG"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG: Merged PR #${{ github.event.pull_request.number }} (${{ steps.semver_label.outputs.bump_type }})"
          git push origin "$NEW_TAG"
