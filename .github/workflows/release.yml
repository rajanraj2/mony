name: Mony Multi-Platform Release & Deployment

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  compute_tag:
    name: Check Labels & Compute Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Version
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
              echo "PR closed without merging. Skipping."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            echo "PR Labels: $LABELS"

            BUMP=""
            if echo "$LABELS" | grep -iq '"major"'; then
              BUMP="major"
            elif echo "$LABELS" | grep -iq '"minor"'; then
              BUMP="minor"
            elif echo "$LABELS" | grep -iq '"patch"'; then
              BUMP="patch"
            fi

            if [ -z "$BUMP" ]; then
              echo "No SemVer label found. Skipping."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            echo "Latest Tag: $LATEST_TAG"

            CLEAN_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif [ "$BUMP" = "patch" ]; then
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            echo "Creating and pushing tag $NEW_TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG (Merged PR #${{ github.event.pull_request.number }})"
            git push origin "$NEW_TAG"

            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered directly with tag: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

  deploy_web:
    name: Build & Deploy Web Application
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Web Platform Files
        run: flutter create . --org com.monyapp --project-name mony --platforms web

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Web Application
        run: flutter build web --release --base-href "/mony/"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_android:
    name: Build Android APK
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform Files
        run: flutter create . --org com.monyapp --project-name mony --platforms android

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mony-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_macos:
    name: Build macOS Application (.dmg / .zip)
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create macOS Platform Files
        run: flutter create . --org com.monyapp --project-name mony --platforms macos

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build macOS App
        run: flutter build macos --release

      - name: Package macOS DMG / ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r Mony-macOS.zip Mony.app
          hdiutil create -volname "Mony" -srcfolder Mony.app -ov -format UDZO Mony.dmg

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mony-macos-dmg
          path: |
            build/macos/Build/Products/Release/Mony.dmg
            build/macos/Build/Products/Release/Mony-macOS.zip

  create_release:
    name: Publish GitHub Release
    needs: [compute_tag, build_android, build_macos, deploy_web]
    runs-on: ubuntu-latest
    if: needs.compute_tag.outputs.should_release == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: mony-android-apk
          path: release-artifacts

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: mony-macos-dmg
          path: release-artifacts

      - name: Create GitHub Release Entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute_tag.outputs.tag_name }}
          name: Release ${{ needs.compute_tag.outputs.tag_name }}
          files: |
            release-artifacts/app-release.apk
            release-artifacts/Mony.dmg
            release-artifacts/Mony-macOS.zip
          draft: false
          prerelease: false
          generate_release_notes: true
