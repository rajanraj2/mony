name: Mony Multi-Platform Release & Deployment

on:
  pull_request:
    types: [closed]
    branches: [main]
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.3.0)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  compute_tag:
    name: Check Labels & Compute Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Evaluate Version
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
              echo "PR not merged. Skipping."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
            BUMP=""
            if echo "$LABELS" | grep -iq '"major"'; then
              BUMP="major"
            elif echo "$LABELS" | grep -iq '"minor"'; then
              BUMP="minor"
            elif echo "$LABELS" | grep -iq '"patch"'; then
              BUMP="patch"
            fi

            if [ -z "$BUMP" ]; then
              echo "No SemVer label found. Skipping."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi

            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
            CLEAN_VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VERSION"
            MAJOR=${MAJOR:-0}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}

            if [ "$BUMP" = "major" ]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            elif [ "$BUMP" = "patch" ]; then
              PATCH=$((PATCH + 1))
            fi

            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$NEW_TAG" -m "Release $NEW_TAG (Merged PR #${{ github.event.pull_request.number }})"
            git push origin "$NEW_TAG"

            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -n "$INPUT_TAG" ]; then
              TAG="$INPUT_TAG"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.3.0")
            fi
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

  deploy_web:
    name: Build & Deploy Web Application
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true' && (github.ref == 'refs/heads/main' || github.event.pull_request.base.ref == 'main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web_preview'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build_android:
    name: Build Android APK
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Project Scaffold
        run: |
          flutter create . --org com.monyapp --project-name mony --platforms android
          # Set compileSdk and targetSdk to 36 for modern android plugin compatibility
          sed -i 's/compileSdk = .*/compileSdk = 36/g' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Drift Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mony-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_macos_dmg:
    name: Build macOS Application (.dmg)
    needs: [compute_tag]
    if: needs.compute_tag.outputs.should_release == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate macOS Project Scaffold
        run: flutter create . --org com.monyapp --project-name mony --platforms macos

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Drift Code Generator
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Native macOS App
        run: flutter build macos --release

      - name: Package Native macOS DMG
        run: |
          mkdir -p release-artifacts
          hdiutil create -volname "Mony" -srcfolder build/macos/Build/Products/Release/mony.app -ov -format UDZO release-artifacts/Mony-macOS.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mony-macos-dmg
          path: release-artifacts/Mony-macOS.dmg

  create_release:
    name: Publish GitHub Release
    needs: [compute_tag, deploy_web, build_android, build_macos_dmg]
    if: always() && needs.compute_tag.outputs.should_release == 'true' && (needs.build_android.result == 'success' || needs.build_macos_dmg.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mony-android-apk
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: mony-macos-dmg
          path: release-assets

      - name: Create Official GitHub Release Entry
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.compute_tag.outputs.tag_name }}
          name: Release ${{ needs.compute_tag.outputs.tag_name }}
          files: |
            release-assets/app-release.apk
            release-assets/Mony-macOS.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
