name: mony
description: "Mony — AI-powered cross-platform personal finance, expense tracking & wealth management"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Local Database ────────────────────────────────────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI / Theming ──────────────────────────────────────────────────────────
  dynamic_color: ^1.7.0
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^25.1.41

  # ── Forms / Input ─────────────────────────────────────────────────────────
  reactive_forms: ^17.0.1
  intl: ^0.19.0
  currency_text_input_formatter: ^2.2.3

  # ── File / IO ─────────────────────────────────────────────────────────────
  file_picker: ^8.0.3
  csv: ^6.0.0
  excel: ^4.0.3
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^9.0.0
  open_filex: ^4.6.0

  # ── HTTP / APIs ───────────────────────────────────────────────────────────
  dio: ^5.5.0
  retrofit: ^4.1.0

  # ── Auth / Security ───────────────────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Background Tasks ──────────────────────────────────────────────────────
  workmanager: ^0.5.2

  # ── Backup ────────────────────────────────────────────────────────────────
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0

  # ── SMS (Android) ─────────────────────────────────────────────────────────
  telephony: ^0.2.0          # SMS listener + reader

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.18.0
  fuzzywuzzy: ^1.1.0         # fuzzy string matching for reconciliation
  diacritic: ^0.1.4

  # ── Logging / Crash ───────────────────────────────────────────────────────
  logger: ^2.4.0

  # ── Image / Assets ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # ── Code Generation ───────────────────────────────────────────────────────
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^8.1.0
  custom_lint: ^0.6.5
  riverpod_lint: ^2.3.13
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
