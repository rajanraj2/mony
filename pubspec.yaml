name: mony
description: "Mony — AI-powered cross-platform personal finance, expense tracking & wealth management"
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Local Database ────────────────────────────────────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI / Theming ──────────────────────────────────────────────────────────
  dynamic_color: ^1.7.0
  flex_color_scheme: ^7.3.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ── Charts ────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Forms / Input ─────────────────────────────────────────────────────────
  intl: ">=0.19.0 <1.0.0"

  # ── File / IO ─────────────────────────────────────────────────────────────
  file_picker: ^8.0.3
  csv: ^6.0.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^9.0.0

  # ── HTTP / APIs ───────────────────────────────────────────────────────────
  dio: ^5.5.0

  # ── Auth / Security ───────────────────────────────────────────────────────
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # ── Notifications ─────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2

  # ── Background Tasks ──────────────────────────────────────────────────────
  workmanager: ^0.5.2

  # ── SMS (Android) ─────────────────────────────────────────────────────────
  telephony: ^0.2.0

  # ── Utilities ─────────────────────────────────────────────────────────────
  uuid: ^4.4.0
  equatable: ^2.0.5
  collection: ^1.18.0
  logger: ^2.4.0

  # ── Image / Assets ────────────────────────────────────────────────────────
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
